name: imk1010_gem
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.18
  - cobra=0.32.1      # constraint-based modelling (FBA, FVA, knockouts)
  - optlang=1.9.1     # solver interface used by cobra
  - glpk=5.0         # open-source LP solver (cobra's default)
  - pandas=2.3.3
  - matplotlib=3.11.2
  - pytest=9.2.0
  - jupyterlab=4.6.6
  - pip
