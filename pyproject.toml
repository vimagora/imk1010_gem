[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imk1010-gem"
version = "0.1.0"
description = "Constraint-based analysis of the sugar-transporter-deficient yeast strain IMK1010 with Yeast9"
requires-python = ">=3.11"
dependencies = ["cobra", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
